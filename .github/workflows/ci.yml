name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: subscriptions_test
          POSTGRES_USER: subscriptions
          POSTGRES_PASSWORD: subscriptions
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subscriptions -d subscriptions_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://subscriptions:subscriptions@localhost:5432/subscriptions_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test -race ./...
